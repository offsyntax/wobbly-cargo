<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Wobbly Cargo</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1E1B2E; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
      #game { position: fixed; top: 0; left: 0; margin: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }
      canvas { display: block; touch-action: none; width: 100% !important; height: 100% !important; }
      #safe { position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none; box-sizing: content-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="safe"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
