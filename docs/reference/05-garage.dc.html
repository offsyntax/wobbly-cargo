<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wobbly Cargo – Garage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E1B2E}a:hover{color:#4A4560}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #FFF1DA; font-family: 'Nunito', sans-serif; color: #1E1B2E; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 14px;">

<div style="display: flex; align-items: center; justify-content: space-between;">
<button aria-label="Back" style="width: 48px; height: 48px; border-radius: 14px; background: #FFFFFF; border: 4px solid #1E1B2E; box-shadow: 0 4px 0 #1E1B2E; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 3 L6 10 L13 17" fill="none" stroke="#1E1B2E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<div style="font-family: 'Lilita One', sans-serif; font-size: 30px; letter-spacing: 1px;">GARAGE</div>
<div style="display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 4px solid #1E1B2E; border-radius: 999px; padding: 6px 12px 6px 8px; box-shadow: 0 4px 0 #1E1B2E; font-family: 'Lilita One', sans-serif; font-size: 18px;"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="#FFC93C" stroke="#1E1B2E" stroke-width="3"></circle><path d="M11 6 V16" stroke="#1E1B2E" stroke-width="2.5" stroke-linecap="round"></path></svg>3,860</div>
</div>

<div style="position: relative; height: 200px; border-radius: 24px; background: #FFE3B0; border: 3px solid #1E1B2E; overflow: hidden;">
<svg width="352" height="200" viewBox="0 0 352 200" style="position: absolute; left: 0; top: 0;" aria-hidden="true">
<circle cx="176" cy="100" r="92" fill="#FFF1D2"></circle>
<ellipse cx="176" cy="172" rx="122" ry="20" fill="#FFC93C" stroke="#1E1B2E" stroke-width="4"></ellipse>
<g transform="translate(176 172) scale(1.5)">
<ellipse cx="-40" cy="-73" rx="8" ry="10" fill="#FFF8EC" stroke="#1E1B2E" stroke-width="3"></ellipse>
<ellipse cx="-25" cy="-74" rx="8" ry="10" fill="#FFF8EC" stroke="#1E1B2E" stroke-width="3"></ellipse>
<ellipse cx="-10" cy="-73" rx="8" ry="10" fill="#FFF8EC" stroke="#1E1B2E" stroke-width="3"></ellipse>
<rect x="-50" y="-69" width="50" height="22" rx="3" fill="#C98B4E" stroke="#1E1B2E" stroke-width="3"></rect>
<rect x="-55" y="-49" width="62" height="22" rx="4" fill="#E8443A" stroke="#1E1B2E" stroke-width="4"></rect>
<path d="M5 -27 L5 -61 Q5 -67 11 -67 L32 -67 Q38 -67 41 -61 L52 -43 Q55 -39 55 -35 L55 -27 Z" fill="#E8443A" stroke="#1E1B2E" stroke-width="4" stroke-linejoin="round"></path>
<path d="M13 -59 L30 -59 L38 -45 L13 -45 Z" fill="#BFE9FF" stroke="#1E1B2E" stroke-width="3" stroke-linejoin="round"></path>
<rect x="-58" y="-31" width="116" height="10" rx="5" fill="#2E2A3F" stroke="#1E1B2E" stroke-width="3"></rect>
<circle cx="-34" cy="-15" r="15" fill="#2E2A3F" stroke="#1E1B2E" stroke-width="4"></circle>
<circle cx="-34" cy="-15" r="6" fill="#C9C4D6"></circle>
<circle cx="34" cy="-15" r="15" fill="#2E2A3F" stroke="#1E1B2E" stroke-width="4"></circle>
<circle cx="34" cy="-15" r="6" fill="#C9C4D6"></circle>
</g>
</svg>
<div style="position: absolute; left: 14px; top: 12px; display: flex; align-items: center; gap: 8px;">
<span style="font-family: 'Lilita One', sans-serif; font-size: 22px; letter-spacing: 1px;">PICKUP</span>
<span style="font-size: 12px; font-weight: 800; background: #4CC26B; border: 2px solid #1E1B2E; border-radius: 999px; padding: 2px 10px;">OWNED</span>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
<button aria-label="Pickup, selected" style="height: 84px; background: #E6F4FF; border: 4px solid #2B8FE0; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 4px; cursor: pointer; font-family: 'Nunito', sans-serif;"><svg width="44" height="26" viewBox="0 0 44 26" aria-hidden="true"><rect x="2" y="8" width="22" height="9" rx="2" fill="#E8443A" stroke="#1E1B2E" stroke-width="2"></rect><path d="M24 17 V4 H33 L40 12 V17 Z" fill="#E8443A" stroke="#1E1B2E" stroke-width="2" stroke-linejoin="round"></path><circle cx="11" cy="20" r="5" fill="#2E2A3F" stroke="#1E1B2E" stroke-width="2"></circle><circle cx="33" cy="20" r="5" fill="#2E2A3F" stroke="#1E1B2E" stroke-width="2"></circle></svg><span style="font-size: 12px; font-weight: 800; color: #1E1B2E;">Pickup</span></button>
<button aria-label="Dolmuş, locked, 2,000 coins" style="height: 84px; background: #FFFFFF; border: 3px solid #1E1B2E; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px; cursor: pointer; font-family: 'Nunito', sans-serif;"><svg width="44" height="26" viewBox="0 0 44 26" aria-hidden="true"><path d="M3 17 V6 Q3 3 6 3 H34 Q38 3 40 8 L42 13 V17 Z" fill="#FFD84D" stroke="#1E1B2E" stroke-width="2" stroke-linejoin="round"></path><rect x="7" y="6" width="7" height="5" fill="#BFE9FF" stroke="#1E1B2E" stroke-width="1.5"></rect><rect x="17" y="6" width="7" height="5" fill="#BFE9FF" stroke="#1E1B2E" stroke-width="1.5"></rect><rect x="27" y="6" width="7" height="5" fill="#BFE9FF" stroke="#1E1B2E" stroke-width="1.5"></rect><circle cx="11" cy="20" r="5" fill="#2E2A3F" stroke="#1E1B2E" stroke-width="2"></circle><circle cx="33" cy="20" r="5" fill="#2E2A3F" stroke="#1E1B2E" stroke-width="2"></circle></svg><span style="font-size: 12px; font-weight: 800; color: #1E1B2E;">Dolmuş</span><span style="display: flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; color: #4A4560;"><svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true"><rect x="1" y="5" width="8" height="6" rx="1.5" fill="#4A4560"></rect><path d="M3 5 V3.5 Q3 1 5 1 Q7 1 7 3.5 V5" fill="none" stroke="#4A4560" stroke-width="1.6"></path></svg>2,000</span></button>
<button aria-label="Monster truck, locked, 5,000 coins" style="height: 84px; background: #FFFFFF; border: 3px solid #1E1B2E; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px; cursor: pointer; font-family: 'Nunito', sans-serif;"><svg width="44" height="26" viewBox="0 0 44 26" aria-hidden="true"><rect x="4" y="5" width="20" height="8" rx="2" fill="#4FB3FF" stroke="#1E1B2E" stroke-width="2"></rect><path d="M24 13 V2 H32 L38 9 V13 Z" fill="#4FB3FF" stroke="#1E1B2E" stroke-width="2" stroke-linejoin="round"></path><circle cx="11" cy="19" r="6.5" fill="#2E2A3F" stroke="#1E1B2E" stroke-width="2"></circle><circle cx="33" cy="19" r="6.5" fill="#2E2A3F" stroke="#1E1B2E" stroke-width="2"></circle></svg><span style="font-size: 12px; font-weight: 800; color: #1E1B2E;">Monster</span><span style="display: flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; color: #4A4560;"><svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true"><rect x="1" y="5" width="8" height="6" rx="1.5" fill="#4A4560"></rect><path d="M3 5 V3.5 Q3 1 5 1 Q7 1 7 3.5 V5" fill="none" stroke="#4A4560" stroke-width="1.6"></path></svg>5,000</span></button>
<button aria-label="Tractor, locked, 8,000 coins" style="height: 84px; background: #FFFFFF; border: 3px solid #1E1B2E; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px; cursor: pointer; font-family: 'Nunito', sans-serif;"><svg width="44" height="26" viewBox="0 0 44 26" aria-hidden="true"><path d="M8 15 V8 H20 V3 H30 V15 Z" fill="#4CC26B" stroke="#1E1B2E" stroke-width="2" stroke-linejoin="round"></path><rect x="30" y="9" width="10" height="6" fill="#4CC26B" stroke="#1E1B2E" stroke-width="2"></rect><circle cx="14" cy="17" r="8" fill="#2E2A3F" stroke="#1E1B2E" stroke-width="2"></circle><circle cx="36" cy="20" r="5" fill="#2E2A3F" stroke="#1E1B2E" stroke-width="2"></circle></svg><span style="font-size: 12px; font-weight: 800; color: #1E1B2E;">Tractor</span><span style="display: flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; color: #4A4560;"><svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true"><rect x="1" y="5" width="8" height="6" rx="1.5" fill="#4A4560"></rect><path d="M3 5 V3.5 Q3 1 5 1 Q7 1 7 3.5 V5" fill="none" stroke="#4A4560" stroke-width="1.6"></path></svg>8,000</span></button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<sc-for list="{{upgrades}}" as="u" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 3px solid #1E1B2E; border-radius: 18px; box-shadow: 0 4px 0 #1E1B2E; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-family: 'Lilita One', sans-serif; font-size: 17px; letter-spacing: 1px;">{{u.name}}</span><span style="font-size: 13px; font-weight: 800; color: #4A4560;">{{u.lv}}</span></div>
<div style="display: flex; gap: 3px;"><sc-for list="{{u.segs}}" as="s" hint-placeholder-count="10"><div style="flex-grow: 1; height: 10px; border-radius: 3px; background: {{s.color}};"></div></sc-for></div>
<button style="display: flex; align-items: center; justify-content: center; gap: 6px; background: #FFC93C; border: 3px solid #1E1B2E; border-radius: 12px; box-shadow: 0 3px 0 #1E1B2E; padding: 8px; font-family: 'Lilita One', sans-serif; font-size: 18px; color: #1E1B2E; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="3"></circle><path d="M11 6 V16" stroke="#1E1B2E" stroke-width="2.5" stroke-linecap="round"></path></svg>{{u.cost}}</button>
</div>
</sc-for>
</div>

<button style="margin-top: auto; width: 100%; background: #4CC26B; border: 4px solid #1E1B2E; border-radius: 20px; box-shadow: 0 6px 0 #1E1B2E; padding: 16px; font-family: 'Lilita One', sans-serif; font-size: 28px; letter-spacing: 2px; color: #1E1B2E; cursor: pointer;">PLAY</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var mk = function (name, lv, cost) {
var segs = [];
for (var i = 0; i < 10; i++) {
segs.push({ color: i < lv ? '#4FB3FF' : '#E3DEEC' });
}
return { name: name, lv: 'Lv ' + lv, cost: cost, segs: segs };
};
return {
upgrades: [
mk('ENGINE', 3, '450'),
mk('SUSPENSION', 2, '300'),
mk('TIRES', 4, '600'),
mk('GRIP', 1, '150')
]
};
}
}
</script>
</body>
</html>
