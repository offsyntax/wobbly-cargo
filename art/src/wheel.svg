<!-- wheel: radius 0.45 m (outer edge incl. outline = 18 px). Canvas 40x40, pivot = hub centre (20,20), origin (0.5,0.5). -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <circle cx="20" cy="20" r="16" fill="#4A4560" stroke="#1E1B2E" stroke-width="4"/>
  <circle cx="20" cy="20" r="8" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="3"/>
  <line x1="20" y1="13" x2="20" y2="27" stroke="#1E1B2E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="20" cy="20" r="2.5" fill="#FFC93C" stroke="#1E1B2E" stroke-width="1.5"/>
  <circle cx="20" cy="7" r="2" fill="#FFC93C"/>
</svg>
